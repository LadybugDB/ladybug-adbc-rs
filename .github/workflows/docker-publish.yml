# Build + publish the server image to GHCR on every GitHub Release.
# (No crates.io publish by design.)
#
# Flow: create a Release in the GitHub UI (tag e.g. v0.1.0) -> this workflow
# tests, then builds multi-arch (amd64/arm64) and pushes:
#   ghcr.io/ladybugdb/ladybug-adbc-rs:<version>
#   ghcr.io/ladybugdb/ladybug-adbc-rs:<major>.<minor>
#   ghcr.io/ladybugdb/ladybug-adbc-rs:latest   (non-prereleases only)
name: docker-publish

on:
  release:
    types: [published]
  workflow_dispatch: # manual "Run workflow" for testing without a release

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ladybugdb/ladybug-adbc-rs

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # TEMPORARY: ladybug-rust >= 19c48ac4 needs common/arrow/*.h to compile
      # its cxx shims, but the prebuilt artifacts ship only
      # lbug.h / lbug.hpp / liblbug.a. scripts/fetch-lbug-deps.sh assembles
      # prebuilt lib + matching source headers (core #970) so the build uses
      # ladybug-rust's "external" path instead of compiling all of core.
      # Drop this once the precompiled-bin workflow bundles the headers.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LBUG_LIBRARY_DIR: /tmp/lbug-deps/lib-amd64
      LBUG_INCLUDE_DIR: /tmp/lbug-deps/include
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch prebuilt lib + matching core headers
        run: bash scripts/fetch-lbug-deps.sh 34930255321 553e2c5276ba14eb9d3e004dc77c5413e62925c7 /tmp/lbug-deps amd64
      - run: cargo test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prebuilt libs + matching core headers for the image build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-lbug-deps.sh 34930255321 553e2c5276ba14eb9d3e004dc77c5413e62925c7 lbug-deps amd64 arm64

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

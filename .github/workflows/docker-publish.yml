# Build + publish the server image to GHCR on every GitHub Release.
# (No crates.io publish by design.)
#
# Flow: create a Release in the GitHub UI (tag e.g. v0.1.0) -> this workflow
# tests, then builds multi-arch (amd64/arm64) and pushes:
#   ghcr.io/ladybugdb/ladybug-adbc-rs:<version>
#   ghcr.io/ladybugdb/ladybug-adbc-rs:<major>.<minor>
#   ghcr.io/ladybugdb/ladybug-adbc-rs:latest   (non-prereleases only)
#
# Linux only: the icebug crate pulls in libarrow (C++) + libgomp (the
# prebuilt libnetworkit.so was linked against GCC's libgomp, not LLVM's
# libomp) + the libnetworkit.so prebuilt (scripts/download-icebug.sh).
# macOS / Windows builds are not part of this image.
name: docker-publish

on:
  release:
    types: [published]
  workflow_dispatch: # manual "Run workflow" for testing without a release

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ladybugdb/ladybug-adbc-rs

jobs:
  test:
    # Pinned (not ubuntu-latest): the Apache Arrow apt source below is
    # per-distro (noble .deb here). Mirrors bugscope pinning ubuntu-22.04
    # with the jammy .deb.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        timeout-minutes: 25
        run: |
          # Apache Arrow repo (icebug's cxx bridge needs arrow headers;
          # not in stock Ubuntu). `<omp.h>` ships with GCC itself — no
          # libgomp-dev package exists.
          wget --timeout=60 --tries=3 https://apache.jfrog.io/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-noble.deb
          sudo apt-get install -y ./apache-arrow-apt-source-latest-noble.deb
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libssl-dev \
            libarrow-dev \
            libadbc-driver-manager112

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download shared liblbug
        run: bash scripts/download-liblbug.sh

      - name: Download icebug prebuilt
        run: bash scripts/download-icebug.sh

      - run: cargo test

  # Native per-arch builds: amd64 on a standard runner, arm64 on a
  # GitHub-hosted arm64 runner — no QEMU emulation (compiling this repo
  # under QEMU took ~2.5h). The merge job assembles the manifest list.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-24.04
            digest-name: amd64
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            digest-name: arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.digest-name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.digest-name }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.digest-name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
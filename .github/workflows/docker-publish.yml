# Build + publish the server image to GHCR on every GitHub Release.
# (No crates.io publish by design.)
#
# Flow: create a Release in the GitHub UI (tag e.g. v0.1.0) -> this workflow
# tests, then builds multi-arch (amd64/arm64) and pushes:
#   ghcr.io/ladybugdb/ladybug-adbc-rs:<version>
#   ghcr.io/ladybugdb/ladybug-adbc-rs:<major>.<minor>
#   ghcr.io/ladybugdb/ladybug-adbc-rs:latest   (non-prereleases only)
name: docker-publish

on:
  release:
    types: [published]
  workflow_dispatch: # manual "Run workflow" for testing without a release

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ladybugdb/ladybug-adbc-rs

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # TEMPORARY: prebuilt core from a main-branch run that includes the
      # prepared-statement schema API (core #970). The default latest release
      # (v0.20.4) predates it, so headers/sources would not compile.
      # TODO: remove once a core release containing #970 is out — the
      # download script then falls back to that release automatically.
      LBUG_PRECOMPILED_RUN_ID: "34930255321"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
